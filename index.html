<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apa nak makan tonight?</title>
  <style>
    body {
      font-family: 'Comic Sans MS', 'Sniglet', 'Baloo 2', system-ui, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #FF9A9E, #FECFEF);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #333;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 3rem;
      color: #FF416C;
      text-shadow: 2px 2px 0px #FFF;
      margin-bottom: 40px;
    }
    button {
      background: #FF4B2B;
      color: white;
      border: none;
      padding: 18px 36px;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:active {
      transform: scale(0.95);
      box-shadow: 0 2px 8px rgba(255, 75, 43, 0.4);
    }
    #result {
      font-size: 3.5rem;
      font-weight: 900;
      margin-top: 50px;
      color: #FF4B2B;
      text-shadow: 2px 2px 0px #FFF;
      opacity: 0;
      transition: opacity 0.3s ease-in-out, transform 0.3s ease-out;
      transform: translateY(20px);
    }
    #result.show {
      opacity: 1;
      transform: translateY(0);
    }
    @media (max-width: 600px) {
      h1 { font-size: 2.2rem; }
      button { font-size: 1.2rem; padding: 15px 30px; }
      #result { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <h1>Apa nak makan tonight? 😋</h1>
  <button onclick="pickDish()">Pilih untuk saya!</button>
  <div id="result"></div>
  <script>
    const dishes = [
      { name: "Nasi Lemak", emoji: "🍚" },
      { name: "Roti Canai", emoji: "🫓" },
      { name: "Laksa", emoji: "🍜" },
      { name: "Satay", emoji: "🍢" },
      { name: "Mee Goreng", emoji: "🍝" },
      { name: "Cendol", emoji: "🍧" },
      { name: "Rendang", emoji: "🍛" },
      { name: "Teh Tarik", emoji: "☕" },
      { name: "Mee Rebus", emoji: "🍲" },
      { name: "Nasi Kerabu", emoji: "🥗" }
    ];

    function pickDish() {
      const res = document.getElementById("result");
      const dish = dishes[Math.floor(Math.random() * dishes.length)];
      
      res.classList.remove('show');
      
      setTimeout(() => {
        res.innerHTML = `${dish.name} ${dish.emoji}`;
        res.classList.add('show');
      }, 150);
    }
  </script>
</body>
</html>
